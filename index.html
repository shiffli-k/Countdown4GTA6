<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA VI Release Countdown</title>

  <!-- Google Fonts for GTA / Vice City Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,800;1,900&family=Orbitron:wght@600;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-cyan-glow: rgba(0, 240, 255, 0.45);
      --neon-pink: #ff2a85;
      --neon-pink-glow: rgba(255, 42, 133, 0.45);
      --sunset-orange: #ff7b00;
      --sunset-yellow: #ffd000;
      --bg-dark: #0a0116;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse 90% 60% at 50% 0%, rgba(120, 20, 160, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(255, 42, 133, 0.22) 0%, transparent 70%),
        linear-gradient(180deg, #090014 0%, #150326 40%, #1a0430 70%, #0d011c 100%);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Retro grid lines near horizon */
    body::before {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 250px;
      background: linear-gradient(to bottom, transparent, rgba(255, 42, 133, 0.08) 30%, rgba(0, 240, 255, 0.12) 100%),
        repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(255, 42, 133, 0.15) 20px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0, 240, 255, 0.08) 40px);
      pointer-events: none;
      z-index: 0;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    }

    .main-container {
      position: relative;
      z-index: 1;
    }

    /* Vice City Header */
    .vice-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      padding: 0.35rem 1.1rem;
      border-radius: 50px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 16px var(--neon-cyan-glow);
    }

    .gta-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-top: 0.75rem;
      margin-bottom: 0;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #ffe680 20%, #ff5e62 55%, #ff0f7b 80%, #b000ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 20px rgba(255, 15, 123, 0.45));
    }

    .gta-subtitle {
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e0a3ff;
      text-shadow: 0 0 12px rgba(224, 163, 255, 0.5);
    }

    /* Cards */
    .countdown-card {
      background: rgba(22, 6, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      padding: 2rem 1.75rem;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .countdown-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .countdown-card:hover {
      transform: translateY(-6px);
    }

    /* Card Themes */
    .card-nz {
      border: 1px solid rgba(0, 240, 255, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(0, 240, 255, 0.15);
    }
    .card-nz::before {
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }
    .card-nz:hover {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 32px rgba(0, 240, 255, 0.35);
      border-color: var(--neon-cyan);
    }
    .card-nz .region-title {
      color: var(--neon-cyan);
      text-shadow: 0 0 14px var(--neon-cyan-glow);
    }
    .card-nz .time-value {
      color: #00f0ff;
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.8), 0 0 28px rgba(0, 240, 255, 0.4);
    }

    .card-india {
      border: 1px solid rgba(255, 42, 133, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 42, 133, 0.15);
    }
    .card-india::before {
      background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
    }
    .card-india:hover {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 32px rgba(255, 42, 133, 0.35);
      border-color: var(--neon-pink);
    }
    .card-india .region-title {
      color: var(--neon-pink);
      text-shadow: 0 0 14px var(--neon-pink-glow);
    }
    .card-india .time-value {
      color: #ff2a85;
      text-shadow: 0 0 14px rgba(255, 42, 133, 0.8), 0 0 28px rgba(255, 42, 133, 0.4);
    }

    /* Region header in card */
    .region-title {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .region-target {
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: #bfa8d8;
    }

    /* Time Units */
    .time-box {
      background: rgba(10, 2, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem;
      padding: 1.1rem 0.5rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .countdown-card:hover .time-box {
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(14, 3, 28, 0.9);
    }

    .time-value {
      font-family: 'Orbitron', 'Montserrat', sans-serif;
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8c76a5;
      margin-top: 0.45rem;
    }

    /* Alert / Released banner */
    .vice-alert {
      background: rgba(255, 42, 133, 0.15);
      border: 1px solid var(--neon-pink);
      color: #ffffff;
      border-radius: 0.75rem;
      padding: 1.25rem 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-shadow: 0 0 10px var(--neon-pink);
      box-shadow: 0 0 20px var(--neon-pink-glow);
    }
  </style>
</head>
<body class="py-5">
  <div class="container main-container">
    <!-- Header Section -->
    <div class="text-center mb-5">
      <div>
        <span class="vice-badge">★ VICE CITY / LEONIDA ★</span>
      </div>
      <h1 class="gta-title">GTA VI</h1>
      <p class="gta-subtitle mt-2 mb-1">Launch Countdown</p>
    </div>

    <!-- Countdown Cards Row -->
    <div class="row g-4 justify-content-center">
      <!-- New Zealand Release Card (Cyan Theme) -->
      <div class="col-12 col-md-6 col-lg-5">
        <div class="countdown-card card-nz text-center h-100">
          <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
            <span class="fs-4">🇳🇿</span>
            <h2 class="region-title mb-0">New Zealand</h2>
          </div>
          <p class="region-target mb-4">IST: Nov 18, 2026, 4:30PM</p>

          <div id="nz-countdown-container">
            <div class="row g-2 justify-content-center">
              <div class="col-3">
                <div class="time-box">
                  <div class="time-value" id="nz-days">--</div>
                  <div class="time-label">Days</div>
                </div>
              </div>
              <div class="col-3">
                <div class="time-box">
                  <div class="time-value" id="nz-hours">--</div>
                  <div class="time-label">Hours</div>
                </div>
              </div>
              <div class="col-3">
                <div class="time-box">
                  <div class="time-value" id="nz-minutes">--</div>
                  <div class="time-label">Mins</div>
                </div>
              </div>
              <div class="col-3">
                <div class="time-box">
                  <div class="time-value" id="nz-seconds">--</div>
                  <div class="time-label">Secs</div>
                </div>
              </div>
            </div>
          </div>
          <div id="nz-release-message" class="vice-alert d-none my-auto"></div>
        </div>
      </div>

      <!-- India Release Card (Magenta / Pink Theme) -->
      <div class="col-12 col-md-6 col-lg-5">
        <div class="countdown-card card-india text-center h-100">
          <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
            <span class="fs-4">🇮🇳</span>
            <h2 class="region-title mb-0">India</h2>
          </div>
          <p class="region-target mb-4">Launching: Nov 19, 2026, 00:00 IST</p>

          <div id="india-countdown-container">
            <div class="row g-2 justify-content-center">
              <div class="col-3">
                <div class="time-box">
                  <div class="time-value" id="india-days">--</div>
                  <div class="time-label">Days</div>
                </div>
              </div>
              <div class="col-3">
                <div class="time-box">
                  <div class="time-value" id="india-hours">--</div>
                  <div class="time-label">Hours</div>
                </div>
              </div>
              <div class="col-3">
                <div class="time-box">
                  <div class="time-value" id="india-minutes">--</div>
                  <div class="time-label">Mins</div>
                </div>
              </div>
              <div class="col-3">
                <div class="time-box">
                  <div class="time-value" id="india-seconds">--</div>
                  <div class="time-label">Secs</div>
                </div>
              </div>
            </div>
          </div>
          <div id="india-release-message" class="vice-alert d-none my-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Include calculation functions from ReleaseTimeCalc.js -->
  <script src="ReleaseTimeCalc.js"></script>

  <!-- Live Countdown Updater -->
  <script>
    function padZero(num) {
      return String(num).padStart(2, '0');
    }

    function renderCountdown(data, prefix) {
      const containerEl = document.getElementById(`${prefix}-countdown-container`);
      const messageEl = document.getElementById(`${prefix}-release-message`);

      if (data.released) {
        containerEl.classList.add('d-none');
        messageEl.classList.remove('d-none');
        messageEl.textContent = data.message;
      } else {
        containerEl.classList.remove('d-none');
        messageEl.classList.add('d-none');

        document.getElementById(`${prefix}-days`).textContent = padZero(data.days);
        document.getElementById(`${prefix}-hours`).textContent = padZero(data.hours);
        document.getElementById(`${prefix}-minutes`).textContent = padZero(data.minutes);
        document.getElementById(`${prefix}-seconds`).textContent = padZero(data.seconds);
      }
    }

    function updateTimers() {
      // Calls functions from ReleaseTimeCalc.js
      const nzData = timeRemainingForNewZelandRelease();
      const indiaData = timeRemainingForIndiaRelease();

      renderCountdown(nzData, 'nz');
      renderCountdown(indiaData, 'india');
    }

    // Initial render
    updateTimers();

    // 1-second interval
    setInterval(updateTimers, 1000);
  </script>
</body>
</html>
